apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: botkube-demo-access
  namespace: demo
rules:
- apiGroups: [""]
  resources: ["pods","services","configmaps","events"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","replicasets","statefulsets","daemonsets"]
  verbs: ["get","list","watch"]
