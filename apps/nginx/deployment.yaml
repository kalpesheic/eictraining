apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
        annotations:
        gitops-test: "v2"
          
    spec:
      nodeSelector:
        worker-pool: high
      containers:
      - name: nginx
        image: nginx:1.28

        ports:
        - containerPort: 80
